<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenidos</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #39ff14;
      font-family: "Courier New", monospace;
      text-transform: uppercase;
    }

    .cartel {
      border: 6px solid #ff00ff;
      border-radius: 0;
      box-shadow: 10px 10px 0 #ff00ff;
      padding: 3rem 4rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 12vw, 7rem);
      letter-spacing: 0.1em;
    }

    p {
      margin: 1.5rem 0 0;
      font-size: 1rem;
      letter-spacing: 0.35em;
      border-top: 6px solid #ff00ff;
      padding-top: 1.5rem;
    }
  </style>
</head>
<body>
  <main class="cartel">
    <h1>Bienvenidos</h1>
    <p>Pasen sin miedo</p>
  </main>
</body>
</html>
